    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    const CRC_TABLE = (() => {
      const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
        t[n] = c;
      }
      return t;
    })();

    function crc32(bytes) {
      let c = 0xFFFFFFFF;
      for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
      return (c ^ 0xFFFFFFFF) >>> 0;
    }

    function parseZip(bytes) {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      let eocd = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 22 - 65536); i--) {
        if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error("template archive is corrupt (no EOCD)");
      const count = view.getUint16(eocd + 10, true);
      let off = view.getUint32(eocd + 16, true);
      const entries = [];
      for (let i = 0; i < count; i++) {
        if (view.getUint32(off, true) !== 0x02014b50) throw new Error("bad central directory");
        const method = view.getUint16(off + 10, true);
        const time = view.getUint16(off + 12, true);
        const date = view.getUint16(off + 14, true);
        const crc = view.getUint32(off + 16, true);
        const compSize = view.getUint32(off + 20, true);
        const uncompSize = view.getUint32(off + 24, true);
        const nameLen = view.getUint16(off + 28, true);
        const extraLen = view.getUint16(off + 30, true);
        const commentLen = view.getUint16(off + 32, true);
        const localOff = view.getUint32(off + 42, true);
        const name = new TextDecoder().decode(bytes.subarray(off + 46, off + 46 + nameLen));
        const lNameLen = view.getUint16(localOff + 26, true);
        const lExtraLen = view.getUint16(localOff + 28, true);
        const dataStart = localOff + 30 + lNameLen + lExtraLen;
        entries.push({
          name, method, time, date, crc, compSize, uncompSize,
          raw: bytes.subarray(dataStart, dataStart + compSize)
        });
        off += 46 + nameLen + extraLen + commentLen;
      }
      return entries;
    }

    function buildZip(entries) {
      const enc = new TextEncoder();
      const chunks = [];
      const central = [];
      let offset = 0;

      function u16(v) { return [v & 0xFF, (v >>> 8) & 0xFF]; }
      function u32(v) { return [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF]; }

      entries.forEach((e) => {
        const nameBytes = enc.encode(e.name);
        const local = new Uint8Array([
          ...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(e.method),
          ...u16(e.time), ...u16(e.date), ...u32(e.crc),
          ...u32(e.compSize), ...u32(e.uncompSize),
          ...u16(nameBytes.length), ...u16(0)
        ]);
        chunks.push(local, nameBytes, e.raw);
        central.push({ e, nameBytes, offset });
        offset += local.length + nameBytes.length + e.raw.length;
      });

      const cdStart = offset;
      central.forEach(({ e, nameBytes, offset: lo }) => {
        const hdr = new Uint8Array([
          ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(e.method),
          ...u16(e.time), ...u16(e.date), ...u32(e.crc),
          ...u32(e.compSize), ...u32(e.uncompSize),
          ...u16(nameBytes.length), ...u16(0), ...u16(0),
          ...u16(0), ...u16(0), ...u32(0), ...u32(lo)
        ]);
        chunks.push(hdr, nameBytes);
        offset += hdr.length + nameBytes.length;
      });

      const eocd = new Uint8Array([
        ...u32(0x06054b50), ...u16(0), ...u16(0),
        ...u16(entries.length), ...u16(entries.length),
        ...u32(offset - cdStart), ...u32(cdStart), ...u16(0)
      ]);
      chunks.push(eocd);

      const total = chunks.reduce((s, c) => s + c.length, 0);
      const out = new Uint8Array(total);
      let pos = 0;
      chunks.forEach((c) => { out.set(c, pos); pos += c.length; });
      return out;
    }

    function xmlEscape(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function agreementQty(id) {
      const row = rowById(id);
      return row ? activeQty(row) : 0;
    }

    function agreementCheckboxStates(totals) {
      const fireAlarm = (totals.fireAlarmRaw || 0) > 0 || (totals.semiRaw || 0) > 0;
      const sprinkler = (totals.sprinklerRaw || 0) > 0 || (totals.quarterlyRaw || 0) > 0 || agreementQty("hydrant") > 0;
      const sensitivity = (totals.sensitivityQty || 0) > 0 && smokeSensitivityYears.some(Boolean);
      const backflow = agreementQty("backflow") > 0;
      const firePump = agreementQty("firePump") > 0 || agreementQty("dieselFirePump") > 0 || agreementQty("firePumpSemi") > 0 || agreementQty("dieselFirePumpSemi") > 0 || agreementQty("firePumpChurn") > 0;
      const extinguisher = agreementQty("extinguisher") > 0 || agreementQty("extinguisherInUnit") > 0 || agreementQty("monthlyExtinguisher") > 0;
      const emergencyLight =
        agreementQty("emergencyLight") > 0 ||
        agreementQty("monthlyLight") > 0 ||
        agreementQty("oneTimeLight") > 0;
      const kitchenOrPaint =
        agreementQty("kitchenQty") > 0 ||
        agreementQty("paintBooth") > 0 ||
        agreementQty("cleanAgent") > 0 ||
        agreementQty("initDevices") > 0;
      // Box order matches the agreement's service table, left column top-to-bottom then right.
      return {
        1: fireAlarm,        // Fire Alarm System Testing and Inspection
        2: false,            // Security System Testing and Inspection
        3: kitchenOrPaint,   // Kitchen or Paint Booth Testing and Inspection (relabeled at generation)
        4: sprinkler,        // Fire Sprinkler System Testing and Inspection
        5: sensitivity,      // Smoke Detector Cleaning and Sensitivity Testing
        6: backflow,         // Backflow Preventer Testing and Inspection
        7: emergencyLight,   // Emergency and Exit Light Inspection (relabeled at generation)
        8: firePump,         // Fire Pump Testing & Inspection
        9: false,            // Special Provisions
        10: extinguisher     // Portable Fire Extinguisher Test and Inspection
      };
    }

    function agreementEquipmentItems() {
      const qty = (id) => Math.max(0, Number(agreementQty(id)) || 0);
      const whole = (value) => Math.max(0, Math.round(value));
      const rows = [];
      const add = (quantity, description, inspection) => {
        const amount = whole(quantity);
        if (amount > 0) rows.push({ qty: amount, desc: description, insp: inspection });
      };
      const standardFrequency = (visits) => {
        const total = whole(visits);
        if (total === 1) return "Annual (1)";
        if (total === 2) return "Semi-Annual (2)";
        if (total === 3) return "Three Times Per Year (3)";
        if (total === 4) return "Quarterly (4)";
        return total + " Visits Per Year (" + total + ")";
      };

      const sprinklerSystems = qty("wet") + qty("dry") + qty("preAction");
      const sprinklerVisits = 1 + Math.max(0, Math.min(3, whole(qty("quarterlyVisit"))));
      add(sprinklerSystems, "Fire Sprinkler System(s)", standardFrequency(sprinklerVisits));
      add(qty("antiFreeze"), "Anti-Freeze Loop(s)", "Annual (1)");
      add(qty("backflow"), "Backflow Preventer(s)", "Annual (1)");

      const alarmPanels = qty("addrPanel");
      const alarmVisits = 1 + (qty("semiAnnual") > 0 ? 1 : 0);
      add(alarmPanels, "Fire Alarm Panel(s)", standardFrequency(alarmVisits));

      const sensitivityDetectors = qty("smokeAddr") + qty("smokeConv");
      const sensitivityVisits = smokeSensitivityYearCount();
      if (qty("sensitivity") > 0 && sensitivityVisits > 0) {
        add(
          sensitivityDetectors,
          "Smoke Detector Sensitivity Testing",
          "Every 2 Years (" + sensitivityVisits + ")"
        );
      }

      add(qty("miscAv"), "Elevator Shunt/Recall Testing", "Annual (1)");

      const firePumps =
        Math.max(qty("firePump"), qty("firePumpSemi")) +
        Math.max(qty("dieselFirePump"), qty("dieselFirePumpSemi"));
      const pumpSemi = qty("firePumpSemi") > 0 || qty("dieselFirePumpSemi") > 0;
      const pumpMonthly = qty("firePumpChurn") > 0;
      const pumpVisits = 1 + (pumpSemi ? 1 : 0) + (pumpMonthly ? 11 : 0);
      add(
        firePumps,
        "Fire Pump(s)",
        pumpMonthly ? "Monthly (" + pumpVisits + ")" : standardFrequency(pumpVisits)
      );

      const extinguishers = qty("extinguisher") + qty("extinguisherInUnit");
      const extinguisherMonthly = qty("monthlyExtinguisher") > 0;
      const extinguisherVisits = 1 + (extinguisherMonthly ? 11 : 0);
      add(
        extinguishers,
        "Portable Fire Extinguisher(s)",
        extinguisherMonthly ? "Monthly (" + extinguisherVisits + ")" : "Annual (1)"
      );

      const emergencyLights = Math.max(qty("emergencyLight"), qty("monthlyLight"), qty("oneTimeLight"));
      const annualLight = qty("emergencyLight") > 0;
      const monthlyLight = qty("monthlyLight") > 0;
      const oneTimeLight = qty("oneTimeLight") > 0;
      const lightVisits = (annualLight ? 1 : 0) + (monthlyLight ? 11 : 0) + (oneTimeLight ? 1 : 0);
      let lightFrequency = "One-Time (1)";
      if (monthlyLight) lightFrequency = "Monthly (" + lightVisits + ")";
      else if (annualLight && oneTimeLight) lightFrequency = "Annual + One-Time (" + lightVisits + ")";
      else if (annualLight) lightFrequency = "Annual (1)";
      add(emergencyLights, "Emergency and Exit Light(s)", lightFrequency);

      add(qty("kitchenQty"), "Kitchen Suppression System(s)", "Semi-Annual (2)");
      add(qty("cleanAgent"), "Clean Agent System(s)", "Semi-Annual (2)");

      return rows;
    }

    function agreementCountText(count) {

    // Inserts pre-built description pages (WordprocessingML) immediately before
    // the Special Provisions heading. It first trims the run of blank spacer
    // paragraphs the template leaves ahead of that heading, then — if the
    // insertion point now follows a page break or section break — drops the
    // block's own leading page break. Without this, the leftover spacers plus a
    // stacked page break render an empty page in front of the descriptions.
    function injectBeforeSpecialProvisions(xml, block, leadBreak) {
      if (!block) return xml;
      const spIntro = xml.indexOf("These Special Provisions are incorporated");
      if (spIntro === -1) return xml;
      const spRun = xml.lastIndexOf("Special Provisions</w:t>", spIntro);
      const headingStart = spRun === -1 ? -1 : xml.lastIndexOf("<w:p>", spRun);
      if (headingStart === -1) return xml;

      const isBlankPara = (p) => {
        if (p.indexOf('<w:br w:type="page"/>') !== -1) return false;
        if (p.indexOf("<w:sectPr") !== -1) return false;
        if (p.indexOf("<w:drawing") !== -1 || p.indexOf("<w:pict") !== -1) return false;
        const texts = p.match(/<w:t[^>]*>[\s\S]*?<\/w:t>/g) || [];
        return texts.every((t) => t.replace(/<[^>]*>/g, "").trim() === "");
      };
      const paraBefore = (pos) => {
        const close = xml.lastIndexOf("</w:p>", pos);
        if (close === -1) return null;
        const start = xml.lastIndexOf("<w:p>", close);
        if (start === -1) return null;
        return { start, end: close + 6 };
      };

      let cut = headingStart;
      for (let prev = paraBefore(cut); prev && isBlankPara(xml.slice(prev.start, prev.end)); prev = paraBefore(cut)) {
        cut = prev.start;
      }
      const prev = paraBefore(cut);
      const prevPara = prev ? xml.slice(prev.start, prev.end) : "";
      const followsBreak =
        prevPara.indexOf('<w:br w:type="page"/>') !== -1 ||
        prevPara.indexOf("<w:sectPr") !== -1;
      if (followsBreak && leadBreak && block.startsWith(leadBreak)) {
        block = block.slice(leadBreak.length);
      }
      return xml.slice(0, cut) + block + xml.slice(headingStart);
    }

    function agreementReportingFeeNoticeXml(estimatedReportingFees) {
      const firstSentence = "Reporting fees are not included in the annual service price stated above. ";
      const middleSentence = "Actual reporting fees may vary based on the requirements of the applicable authority, reporting platform, or jurisdiction. ";
      const estimatedSentence = "Estimated reporting fees are " + money.format(estimatedReportingFees) + ". ";
      const billingSentences = "Billing is performed quarterly. Each quarterly invoice will reflect its share of the annual service price, taxes (if applicable), and reporting fees once confirmed.";
      return '<w:p><w:pPr><w:pStyle w:val="Normal"/><w:spacing w:before="220" w:after="60" w:line="220" w:lineRule="auto"/><w:ind w:start="0" w:end="0" w:firstLine="0" w:hanging="0"/><w:jc w:val="left"/><w:rPr/></w:pPr>' +
        '<w:r><w:rPr><w:b/><w:bCs/></w:rPr><w:t xml:space="preserve">' + xmlEscape(firstSentence) + '</w:t></w:r>' +
        '<w:r><w:rPr/><w:t xml:space="preserve">' + xmlEscape(middleSentence) + '</w:t></w:r>' +
        '<w:r><w:rPr><w:b/><w:bCs/></w:rPr><w:t xml:space="preserve">' + xmlEscape(estimatedSentence) + '</w:t></w:r>' +
        '<w:r><w:rPr/><w:t xml:space="preserve">' + xmlEscape(billingSentences) + '</w:t></w:r></w:p>';
    }

    function insertAgreementReportingFeeNotice(xml, estimatedReportingFees) {
      const marker = "[[ANNUAL_FEE]]";
      const markerIndex = xml.indexOf(marker);
      if (markerIndex === -1) return xml;
      const paragraphEnd = xml.indexOf("</w:p>", markerIndex);
      if (paragraphEnd === -1) return xml;
      const insertAt = paragraphEnd + "</w:p>".length;
      return xml.slice(0, insertAt) + agreementReportingFeeNoticeXml(estimatedReportingFees) + xml.slice(insertAt);
    }

    function revealAgreementFrequencyCounts(xml) {
      // The template stores the first fire-alarm count and the extinguisher
      // count in hidden CommentReference runs. Replacing the placeholder text
      // alone therefore leaves the populated value invisible in Word.
      return xml.replace(/<w:r>[\s\S]*?<\/w:r>/g, (runXml) => {
        if (!runXml.includes("[[FA_COUNT]]") && !runXml.includes("[[EXT_COUNT]]")) {
          return runXml;
        }
        return runXml
          .replace(/<w:vanish\/>/g, "")
          .replace(/<w:rStyle w:val="CommentReference"\/>/g, "");
      });
    }

    function agreementEquipmentTable(items) {
      const border = '<w:tcBorders><w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:start w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:end w:val="single" w:sz="4" w:space="0" w:color="000000"/></w:tcBorders>';
      const cell = (width, value, bold) =>
        '<w:tc><w:tcPr><w:tcW w:w="' + width + '" w:type="dxa"/>' + border + '</w:tcPr>' +
        '<w:p><w:pPr><w:pStyle w:val="Header"/><w:numPr><w:ilvl w:val="0"/><w:numId w:val="0"/></w:numPr>' +
        '<w:ind w:hanging="0" w:start="0"/><w:jc w:val="center"/><w:rPr><w:sz w:val="' + (bold ? "22" : "20") + '"/><w:szCs w:val="' + (bold ? "22" : "20") + '"/></w:rPr></w:pPr>' +
        '<w:r><w:rPr>' + (bold ? '<w:b/><w:bCs/>' : '') + '<w:sz w:val="' + (bold ? "22" : "20") + '"/><w:szCs w:val="' + (bold ? "22" : "20") + '"/></w:rPr>' +
        '<w:t xml:space="preserve">' + xmlEscape(value) + '</w:t></w:r></w:p></w:tc>';
      const row = (quantity, description, inspection, header) =>
        '<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="' + (header ? "320" : "288") + '" w:hRule="atLeast"/></w:trPr>' +
        cell(1300, quantity, header) + cell(5700, description, header) + cell(2360, inspection, header) + '</w:tr>';
      let table =
        '<w:tbl><w:tblPr><w:tblW w:w="9360" w:type="dxa"/><w:tblLayout w:type="fixed"/>' +
        '<w:tblBorders><w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:start w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:end w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:insideV w:val="single" w:sz="4" w:space="0" w:color="000000"/></w:tblBorders></w:tblPr>' +
        '<w:tblGrid><w:gridCol w:w="1300"/><w:gridCol w:w="5700"/><w:gridCol w:w="2360"/></w:tblGrid>';
      table += row("Quantity:", "Description:", "Inspection:", true);
      items.forEach((item) => {
        table += row(String(item.qty), item.desc, item.insp, false);
      });
      return table + '</w:tbl>';
    }

    function replaceAgreementScopeTable(xml, items) {
      const marker = "[[EQUIPMENT_ROWS]]";
      const markerIndex = xml.indexOf(marker);
      if (markerIndex === -1) return xml;
      const tableStart = xml.lastIndexOf("<w:tbl>", markerIndex);
      const tableEndStart = xml.indexOf("</w:tbl>", markerIndex);
      if (tableStart === -1 || tableEndStart === -1) return xml;
      const tableEnd = tableEndStart + "</w:tbl>".length;
      return xml.slice(0, tableStart) + agreementEquipmentTable(items) + xml.slice(tableEnd);
    }

    function agreementParagraphHasVisibleText(paragraphXml) {
      const text = paragraphXml
        .replace(/<w:tab\b[^>]*\/>/g, " ")
        .replace(/<[^>]+>/g, "")
        .replace(/&nbsp;/g, " ")
        .trim();
      return Boolean(text);
    }

    function addAgreementParagraphProps(paragraphXml, propsXml) {
      if (!propsXml) return paragraphXml;
      if (paragraphXml.includes("<w:pPr>")) {
        return paragraphXml.replace("<w:pPr>", "<w:pPr>" + propsXml);
      }
      return paragraphXml.replace("<w:p>", "<w:p><w:pPr>" + propsXml + "</w:pPr>");
    }

    // Final page-one pass: box the services and acceptance tables, fit them
    // inside the 1" margins, keep the acceptance box in one piece, and drop one
    // redundant blank section-break line between the services box and the
    // Total service fee line so the acceptance box stays on page one.
    function finishAgreementFirstPage(pageXml) {
      const TEXT_WIDTH = 9360; // 8.5in page minus two 1in margins, in twips
      const edge = (side) => '<w:' + side + ' w:val="single" w:sz="6" w:space="0" w:color="000000"/>';
      const cellBorders = '<w:tcBorders>' + ["top", "left", "bottom", "right"].map(edge).join("") + '</w:tcBorders>';
      const tableBorders = '<w:tblBorders>' +
        ["top", "left", "bottom", "right", "insideH", "insideV"].map(edge).join("") + '</w:tblBorders>';

      pageXml = pageXml.replace(/<w:tbl>[\s\S]*?<\/w:tbl>/g, (tblXml) => {
        // Only the boxed tables (services checkboxes, SLS / Customer Acceptance)
        // carry cell borders in the template. The "By and between" table does not.
        if (!tblXml.includes("<w:tcBorders>")) return tblXml;

        // Google Docs ignores start/end cell borders when it converts the DOCX
        // to PDF, so write explicit left/right edges and a table-level border set.
        let boxed = tblXml.replace(/<w:tcBorders>[\s\S]*?<\/w:tcBorders>/g, cellBorders);
        boxed = boxed.replace(/<w:tblBorders>[\s\S]*?<\/w:tblBorders>/g, "");
        boxed = boxed.includes("<w:tblLayout")
          ? boxed.replace("<w:tblLayout", tableBorders + "<w:tblLayout")
          : boxed.replace("</w:tblPr>", tableBorders + "</w:tblPr>");

        // Scale a box that is wider than the text area so its right edge prints.
        const widthMatch = boxed.match(/<w:tblW w:w="(\d+)" w:type="dxa"\/>/);
        const tableWidth = widthMatch ? Number(widthMatch[1]) : 0;
        if (tableWidth > TEXT_WIDTH) {
          const scale = TEXT_WIDTH / tableWidth;
          boxed = boxed
            .replace(/<w:tblW w:w="\d+" w:type="dxa"\/>/, '<w:tblW w:w="' + TEXT_WIDTH + '" w:type="dxa"/>')
            .replace(/<w:gridCol w:w="(\d+)"\/>/g, (m, w) => '<w:gridCol w:w="' + Math.floor(Number(w) * scale) + '"/>')
            .replace(/<w:tcW w:w="(\d+)" w:type="dxa"\/>/g, (m, w) => '<w:tcW w:w="' + Math.floor(Number(w) * scale) + '" w:type="dxa"/>');
        }

        // Keep the SLS / Customer Acceptance box together as one block.
        if (boxed.includes("Customer Acceptance:")) {
          const rows = boxed.match(/<w:tr[ >][\s\S]*?<\/w:tr>/g) || [];
          rows.slice(0, -1).forEach((rowXml) => {
            const kept = rowXml.replace(/<w:p>[\s\S]*?<\/w:p>/g, (p) =>
              p.includes("<w:keepNext/>") ? p : addAgreementParagraphProps(p, "<w:keepNext/>"));
            boxed = boxed.replace(rowXml, kept);
          });
        }
        return boxed;
      });

      // Remove one blank line between the services box and the fee line. The
      // template leaves back-to-back section-break paragraphs there; when two
      // are identical, the first one only adds an empty line.
      const feeIndex = pageXml.search(/Total service fee|Annual Fee:/);
      const servicesEnd = feeIndex === -1 ? -1 : pageXml.lastIndexOf("</w:tbl>", feeIndex);
      if (servicesEnd !== -1) {
        const gap = pageXml.slice(servicesEnd, feeIndex);
        const breaks = gap.match(/<w:p><w:pPr><w:sectPr>[\s\S]*?<\/w:sectPr><\/w:pPr><\/w:p>/g) || [];
        for (let i = 0; i + 1 < breaks.length; i++) {
          if (breaks[i] === breaks[i + 1]) {
            const at = pageXml.indexOf(breaks[i], servicesEnd);
            pageXml = pageXml.slice(0, at) + pageXml.slice(at + breaks[i].length);
            break;
          }
        }
      }
      return pageXml;
    }

    function compactAgreementFirstPage(xml) {
      const marker = "Customer Acceptance:";
      const markerIndex = xml.indexOf(marker);
      if (markerIndex === -1) return xml;
      let tableStart = xml.lastIndexOf("<w:tbl>", markerIndex);
      const tableEndStart = xml.indexOf("</w:tbl>", markerIndex);
      if (tableStart === -1 || tableEndStart === -1) return xml;
      const tableEnd = tableEndStart + "</w:tbl>".length;

      let beforeTable = xml.slice(0, tableStart);
      const compactStartMarker = "Services will be provided at the following location(s):";
      const compactMarkerIndex = beforeTable.indexOf(compactStartMarker);
      if (compactMarkerIndex !== -1) {
        const compactStart = beforeTable.lastIndexOf("<w:p>", compactMarkerIndex);
        if (compactStart !== -1) {
          const head = beforeTable.slice(0, compactStart);
          let segment = beforeTable.slice(compactStart);
          segment = segment.replace(/<w:p>[\s\S]*?<\/w:p>/g, (paragraphXml) => {
            if (!agreementParagraphHasVisibleText(paragraphXml) &&
                !paragraphXml.includes("<w:sectPr") &&
                !paragraphXml.includes("<w:br")) {
              return "";
            }
            const compactTargets = [
              "Services will be provided",
              "SLS shall provide Services",
              "Annual Fee:",
              "Period of Agreement:",
              "This proposal shall remain",
              "This proposal and the pages attached"
            ];
            if (!compactTargets.some((target) => paragraphXml.includes(target))) return paragraphXml;
            const cleaned = paragraphXml
              .replace(/<w:spacing\b[^>]*\/>/g, "")
              .replace(/<w:ind\b[^>]*\/>/g, "");
            return addAgreementParagraphProps(
              cleaned,
              '<w:spacing w:before="0" w:after="60" w:line="220" w:lineRule="auto"/><w:ind w:start="0" w:hanging="0"/>'
            );
          });
          beforeTable = head + segment;
        }
      }

      while (true) {
        const previousEnd = beforeTable.lastIndexOf("</w:p>");
        if (previousEnd === -1 || previousEnd + "</w:p>".length !== beforeTable.length) break;
        const previousStart = beforeTable.lastIndexOf("<w:p>", previousEnd);
        if (previousStart === -1) break;
        const paragraphXml = beforeTable.slice(previousStart, previousEnd + "</w:p>".length);
        if (agreementParagraphHasVisibleText(paragraphXml) ||
            paragraphXml.includes("<w:sectPr") ||
            paragraphXml.includes("<w:br")) break;
        beforeTable = beforeTable.slice(0, previousStart);
      }

      let tableXml = xml.slice(tableStart, tableEnd);
      tableXml = tableXml.replace(/<w:tblpPr\b[^>]*\/>/g, "");
      tableXml = tableXml.replace(/<w:tblInd\b[^>]*\/>/g, "");
      if (tableXml.includes("<w:tblPr>")) {
        tableXml = tableXml.replace("<w:tblPr>", '<w:tblPr><w:tblInd w:w="0" w:type="dxa"/>');
      }
      tableXml = tableXml.replace(/<w:trPr\/>/g, "<w:trPr><w:cantSplit/></w:trPr>");
      tableXml = tableXml.replace(/<w:trPr>(?!<w:cantSplit\/>)/g, "<w:trPr><w:cantSplit/>");
      tableXml = tableXml.replace(/<w:trHeight w:val="(\d+)" w:hRule="atLeast"\/>/g, (match, value) => {
        return Number(value) > 480 ? '<w:trHeight w:val="480" w:hRule="atLeast"/>' : match;
      });
      tableXml = tableXml.replace(/<w:sz w:val="(\d+)"\/>/g, (match, value) => {
        const n = Number(value);
        return `<w:sz w:val="${n > 30 ? 30 : n > 20 ? 20 : n}"/>`;
      });
      tableXml = tableXml.replace(/<w:szCs w:val="(\d+)"\/>/g, (match, value) => {
        const n = Number(value);
        return `<w:szCs w:val="${n > 30 ? 30 : n > 20 ? 20 : n}"/>`;
      });

      let rebuilt = beforeTable + tableXml + xml.slice(tableEnd);

      // Normalize every top-level paragraph and box on page one to the same left edge.
      // This removes template-specific paragraph, list, and table offsets that made
      // otherwise related sections begin at slightly different horizontal positions.
      const firstDescriptionMarkers = [
        "Fire Alarm System Testing &amp; Inspection",
        "Fire Pump Testing and Inspection Services",
        "Portable Fire Extinguishers",
        "Special Provisions"
      ];
      let firstPageEnd = rebuilt.length;
      firstDescriptionMarkers.forEach((textMarker) => {
        const idx = rebuilt.indexOf(textMarker);
        if (idx !== -1) {
          const pStart = rebuilt.lastIndexOf("<w:p>", idx);
          if (pStart !== -1) firstPageEnd = Math.min(firstPageEnd, pStart);
        }
      });

      let firstPageXml = rebuilt.slice(0, firstPageEnd);
      const restXml = rebuilt.slice(firstPageEnd);

      // Normalize every paragraph on page one, including paragraphs inside boxes.
      // The remaining offset was stored on the second paragraph inside a table cell,
      // so limiting normalization to standalone paragraphs could never correct it.
      firstPageXml = firstPageXml.replace(/<w:p>[\s\S]*?<\/w:p>/g, (paragraphXml) => {
        let cleaned = paragraphXml
          .replace(/<w:ind\b[^>]*\/>/g, "")
          .replace(/<w:tabs>[\s\S]*?<\/w:tabs>/g, "")
          .replace(/<w:numPr>[\s\S]*?<\/w:numPr>/g, "");

        // Remove leading spaces and tabs even when Word split them across several
        // runs. Empty whitespace-only text nodes at the start are cleared, then the
        // first visible text node is left-trimmed.
        let foundVisibleText = false;
        cleaned = cleaned.replace(/<w:t(\s+xml:space="preserve")?>([\s\S]*?)<\/w:t>/g,
          (textNode, preserve, text) => {
            if (foundVisibleText) return textNode;
            const trimmed = text.replace(/^[\t \u00a0]+/, "");
            if (!trimmed) return `<w:t${preserve || ""}></w:t>`;
            foundVisibleText = true;
            return `<w:t${preserve || ""}>${trimmed}</w:t>`;
          }
        );

        return addAgreementParagraphProps(
          cleaned,
          '<w:ind w:start="0" w:end="0" w:firstLine="0" w:hanging="0"/>'
        );
      });

      // Align every first-page table/box to the same page margin and remove any
      // floating-position or template indentation that shifts a box horizontally.
      firstPageXml = firstPageXml.replace(/<w:tbl>[\s\S]*?<\/w:tbl>/g, (tblXml) => {
        let aligned = tblXml
          .replace(/<w:tblpPr\b[^>]*\/>/g, "")
          .replace(/<w:tblInd\b[^>]*\/>/g, "");
        if (aligned.includes("<w:tblPr>")) {
          aligned = aligned.replace("<w:tblPr>", '<w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:jc w:val="left"/>');
        }
        return aligned;
      });

      // Page one runs through the SLS / Customer Acceptance box. firstPageXml can
      // stop earlier (a service label inside the checkbox box matches a marker),
      // so the final pass is applied to everything up to the end of that box.
      const joinedXml = firstPageXml + restXml;
      const acceptanceAt = joinedXml.indexOf("Customer Acceptance:");
      const acceptanceEnd = acceptanceAt === -1 ? -1 : joinedXml.indexOf("</w:tbl>", acceptanceAt);
      if (acceptanceEnd === -1) return joinedXml;
      const pageOneCut = acceptanceEnd + "</w:tbl>".length;
      return finishAgreementFirstPage(joinedXml.slice(0, pageOneCut)) + joinedXml.slice(pageOneCut);
    }

    function formatAgreementScopeOfWork(xml) {
      const marker = "Scope of Work";
      const markerIndex = xml.lastIndexOf(marker);
      if (markerIndex === -1) return xml;
      const headingStart = xml.lastIndexOf("<w:p>", markerIndex);
      const headingEndStart = xml.indexOf("</w:p>", markerIndex);
      if (headingStart === -1 || headingEndStart === -1) return xml;
      const headingEnd = headingEndStart + "</w:p>".length;
      let headingXml = xml.slice(headingStart, headingEnd);
      headingXml = headingXml
        .replace(/<w:pageBreakBefore\/>/g, "")
        .replace(/<w:keepNext\/>/g, "");
      headingXml = addAgreementParagraphProps(headingXml, "<w:keepNext/><w:pageBreakBefore/>");

      const tableStart = xml.indexOf("<w:tbl>", headingEnd);
      const tableEndStart = tableStart === -1 ? -1 : xml.indexOf("</w:tbl>", tableStart);
      if (tableStart === -1 || tableEndStart === -1) {
        return xml.slice(0, headingStart) + headingXml + xml.slice(headingEnd);
      }
      const tableEnd = tableEndStart + "</w:tbl>".length;
      let tableXml = xml.slice(tableStart, tableEnd);
      const rows = tableXml.match(/<w:tr>[\s\S]*?<\/w:tr>/g) || [];
      if (rows.length) {
        let rowCursor = 0;
        tableXml = tableXml.replace(/<w:tr>[\s\S]*?<\/w:tr>/g, (rowXml) => {
          const isLast = rowCursor === rows.length - 1;
          rowCursor += 1;
          let updated = rowXml
            .replace(/<w:trPr\/>/g, "<w:trPr><w:cantSplit/></w:trPr>")
            .replace(/<w:trPr>(?!<w:cantSplit\/>)/g, "<w:trPr><w:cantSplit/>");
          if (!isLast) {
            updated = updated.replace(/<w:p>[\s\S]*?<\/w:p>/g, (paragraphXml) => {
              if (paragraphXml.includes("<w:keepNext/>")) return paragraphXml;
              return addAgreementParagraphProps(paragraphXml, "<w:keepNext/>");
            });
          }
          return updated;
        });
      }

      return xml.slice(0, headingStart) + headingXml +
        xml.slice(headingEnd, tableStart) + tableXml + xml.slice(tableEnd);
    }

    function removeAgreementScopeOfWork(xml) {
      const marker = "Scope of Work";
      const markerIndex = xml.lastIndexOf(marker);
      if (markerIndex === -1) return xml;
      const headingStart = xml.lastIndexOf("<w:p>", markerIndex);
      const headingEndStart = xml.indexOf("</w:p>", markerIndex);
      if (headingStart === -1 || headingEndStart === -1) return xml;
      const headingEnd = headingEndStart + "</w:p>".length;
      const tableStart = xml.indexOf("<w:tbl>", headingEnd);
      if (tableStart === -1) return xml.slice(0, headingStart) + xml.slice(headingEnd);
      const tableEndStart = xml.indexOf("</w:tbl>", tableStart);
      if (tableEndStart === -1) return xml.slice(0, headingStart) + xml.slice(headingEnd);
      return xml.slice(0, headingStart) + xml.slice(tableEndStart + "</w:tbl>".length);
    }

    /* ===== Finished inspection-agreement PDF + fillable customer setup form ===== */
</script>
