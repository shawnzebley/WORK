<style>
    :root {
      --navy: #004b8d;
      --navy-dark: #002f5f;
      --red: #d71920;
      --red-dark: #aa1419;
      --red-soft: #fde9ea;
      --blue-input: #e7f1fb;
      --blue-text: #003d73;
      --formula: #f6f7f8;
      --formula-blue: #ddeaf7;
      --section: #edf1f5;
      --summary: #f8e7e8;
      --line: #b7c7d8;
      --ink: #1d252c;
      --muted: #5b6770;
      --paper: #ffffff;
      --soft: #f4f6f8;
      --danger: #a33b35;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #eef3f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow-anchor: none;
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
    }

    .app {
      width: min(1600px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 34px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-logo {
      width: 190px;
      max-width: 28vw;
      height: auto;
      flex: 0 0 auto;
    }

    .toolbar h1 {
      margin: 0;
      font-size: 1.45rem;
      color: var(--navy-dark);
      letter-spacing: 0;
      border-left: 5px solid var(--red);
      padding-left: 12px;
    }

    .toolbar p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .button {
      min-height: 38px;
      border: 1px solid #e1a7aa;
      border-radius: 4px;
      background: linear-gradient(180deg, #fff, var(--red-soft));
      color: var(--red-dark);
      font-weight: 700;
      padding: 0 12px;
      cursor: pointer;
    }

    .button.primary {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    /* Same treatment as the other secondary toolbar buttons: white fill,
       red text, soft red outline. Stated explicitly so the button keeps its
       intended look if the shared .button defaults ever change. */
    .button.itemized {
      background: #fff;
      border-color: #e1a7aa;
      color: var(--red-dark);
    }

    .button:hover {
      filter: brightness(0.96);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(620px, 1.1fr) minmax(500px, 0.9fr);
      gap: 18px;
      align-items: start;
    }

    .workbook,
    .proposal-wrap {
      background: var(--paper);
      border: 1px solid #b5c6d6;
      border-top: 4px solid var(--red);
      box-shadow: 0 12px 34px rgba(29, 47, 64, 0.12);
    }

    .workbook-title {
      background: linear-gradient(90deg, var(--navy-dark), var(--navy) 72%, var(--red));
      color: white;
      text-align: center;
      font-weight: 800;
      padding: 9px 12px;
      letter-spacing: 0;
    }

    .hint {
      padding: 8px 12px;
      color: #666;
      font-size: 0.86rem;
      border-bottom: 1px solid var(--line);
    }

    .job-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--line);
      border-bottom: 2px solid var(--line);
    }

    .job-summary-cell {
      background: #f7f9fc;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 64px;
    }

    .job-summary-cell.highlight {
      background: #fff8e6;
    }

    .job-summary-label {
      font-size: 0.7rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .job-summary-value {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--navy-dark);
      line-height: 1.2;
      margin-top: 2px;
    }

    .job-summary-value input {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--navy-dark);
      border: 1px solid #c9d2dd;
      border-radius: 3px;
      padding: 2px 6px;
      width: 110px;
      background: #fff;
    }

    .job-summary-sub {
      font-size: 0.72rem;
      color: #777;
      margin-top: 3px;
      line-height: 1.3;
    }

    .job-summary-sub.margin-good { color: #2a7d2a; font-weight: 700; }
    .job-summary-sub.margin-warn { color: #b87900; font-weight: 700; }
    .job-summary-sub.margin-bad { color: #b22222; font-weight: 700; }

    .job-summary-desc {
      font-size: 0.68rem;
      color: #8a8a8a;
      font-style: italic;
      margin-top: 6px;
      padding-top: 5px;
      border-top: 1px dashed #d6dae0;
      line-height: 1.3;
    }

    .estimate-grid {
      display: grid;
      grid-template-columns: 24px 32px minmax(190px, 1.7fr) 56px 60px 60px 40px 66px 70px 76px;
      overflow-x: hidden;
      font-size: 0.7rem;
    }

    .estimate-grid .note-col {
      display: none;
    }

    .estimate-grid .freq {
      display: none;
    }

    .sens-year-toggles {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 3px 8px;
      margin-left: 8px;
    }

    .sens-year-toggle {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
      font-weight: 700;
      color: var(--navy-dark);
      cursor: pointer;
    }

    .estimate-grid .sens-year-toggle input {
      width: auto;
      min-height: 0;
      margin: 0;
      cursor: pointer;
    }

    .cell {
      min-height: 20px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 1px 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      background: #fff;
    }

    .cell.header {
      background: linear-gradient(180deg, var(--navy), var(--navy-dark));
      color: #fff;
      font-weight: 800;
      justify-content: center;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .cell.label {
      font-weight: 700;
      justify-content: flex-end;
      text-align: right;
      color: #1f1f1f;
      white-space: nowrap;
    }

    .cell.input-cell {
      background: var(--blue-input);
      color: var(--blue-text);
      font-weight: 800;
    }

    .cell.formula {
      background: var(--formula);
      color: #404040;
      justify-content: flex-end;
      text-align: right;
    }

    .cell.formula-strong {
      background: var(--formula-blue);
      color: var(--navy-dark);
      font-weight: 800;
      justify-content: flex-end;
      text-align: right;
    }

    .cell.section {
      grid-column: 1 / -1;
      background: linear-gradient(90deg, var(--red-soft), var(--section));
      color: var(--red-dark);
      font-weight: 800;
      justify-content: flex-start;
      min-height: 22px;
      border-left: 4px solid var(--red);
    }

    .cell.summary {
      background: #f7e5e7;
      color: var(--navy-dark);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.7rem;
    }

    .cell.summary-label {
      grid-column: 1 / 4;
      justify-content: flex-end;
      text-align: right;
    }

    .cell.summary-value {
      grid-column: 4 / 6;
      justify-content: flex-end;
      text-align: right;
    }

    .cell.summary-note {
      display: none;
    }

    .cell.summary-label-left {
      grid-column: 1 / 4;
      justify-content: flex-end;
      text-align: right;
    }

    .cell.summary-value-left {
      grid-column: 4 / 6;
      justify-content: flex-end;
      text-align: right;
    }

    .cell.summary-label-right {
      grid-column: 6 / 9;
      justify-content: flex-end;
      text-align: right;
    }

    .cell.summary-value-right {
      grid-column: 9 / 10;
      justify-content: flex-end;
      text-align: right;
    }

    .cell.visit-name {
      grid-column: 1 / 5;
      justify-content: flex-start;
      text-align: left;
      border-left: 3px solid var(--red);
    }

    .cell.visit-date {
      grid-column: 5 / 7;
      justify-content: flex-start;
      text-align: left;
    }

    .cell.visit-cost {
      grid-column: 7 / 9;
      justify-content: flex-end;
      text-align: right;
    }

    .cell.visit-hours {
      grid-column: 9 / 10;
      justify-content: flex-end;
      text-align: right;
    }

    .cell.visit-detail {
      grid-column: 1 / -1;
      justify-content: flex-start;
      text-align: left;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      font-weight: 500;
      font-size: 0.68rem;
      line-height: 1.3;
      color: var(--muted);
      background: #ffffff;
      border-left: 3px solid var(--line);
      padding: 4px 8px 6px;
    }

    .cell.visit-head {
      background: var(--navy-dark);
      color: #fff;
      font-family: "Arial Narrow", "Roboto Condensed", Arial, Helvetica, sans-serif;
      font-size: 0.62rem;
      font-weight: 800;
      line-height: 1.08;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      letter-spacing: -0.05px;
    }

    .cell.visit-row {
      background: #f7f9fc;
      color: var(--ink);
      font-weight: 700;
    }

    .cell input,
    .cell select {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      font-weight: inherit;
      min-height: 16px;
      outline: none;
      text-align: inherit;
    }

    .cell select {
      cursor: pointer;
    }

    .cell.center,
    .cell.center input,
    .cell.center select {
      justify-content: center;
      text-align: center;
    }

    .cell.right,
    .cell.right input {
      justify-content: flex-end;
      text-align: right;
    }

    .span-2 {
      grid-column: span 2;
    }

    .span-4 {
      grid-column: span 4;
    }

    .span-5 {
      grid-column: span 5;
    }

    .top-inputs {
      display: grid;
      grid-template-columns: 26px 150px minmax(180px, 1fr) minmax(180px, 1fr) 150px minmax(140px, 0.78fr);
      grid-auto-rows: 32px;
      border-bottom: 2px solid var(--line);
      font-size: 0.7rem;
    }

    .top-inputs .cell {
      min-height: 32px;
      padding: 2px 8px;
    }

    .top-inputs .cell.label {
      padding-right: 10px;
    }

    .top-inputs .cell:nth-child(6n) {
      border-right: 0;
    }

    .top-inputs .state-badge {
      font-weight: 500;
      color: var(--muted);
      font-size: 0.88em;
      margin-left: 4px;
    }

    .top-inputs .exempt-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      cursor: pointer;
      width: 100%;
      font-weight: 700;
      color: var(--blue-text);
    }

    .top-inputs .exempt-toggle input[type="checkbox"] {
      width: 16px;
      min-height: 0;
      margin: 0;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .top-inputs .exempt-toggle-note {
      font-size: 0.85em;
      color: var(--muted);
      font-weight: 500;
    }

    .year-options {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      border-bottom: 2px solid var(--line);
      font-size: 0.78rem;
    }

    .year-options:empty {
      display: none;
    }

    .year-options .cell {
      min-height: 28px;
      padding: 3px 5px;
    }

    .year-toggle {
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .year-toggle input {
      width: auto;
      min-height: 0;
    }

    .quote-settings {
      display: grid;
      grid-template-columns: 26px 140px minmax(180px, 1fr) minmax(180px, 1fr) 140px minmax(130px, 0.72fr);
      border-bottom: 2px solid var(--line);
      font-size: 0.84rem;
    }

    .quote-settings textarea {
      width: 100%;
      min-height: 64px;
      resize: vertical;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: inherit;
      outline: none;
    }

    .quote-settings .button {
      min-height: 28px;
      padding: 0 8px;
      font-size: 0.78rem;
    }

    .quote-storage-tools {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      padding: 7px 8px;
      border-top: 1px solid var(--line);
      background: #fbfcfd;
    }

    .quote-storage-tools .button {
      flex: 0 0 auto;
      min-height: 30px;
    }

    .quote-save-status {
      flex: 1 1 360px;
      min-width: 240px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .quote-save-status.success {
      color: #176a3a;
      font-weight: 700;
    }

    .quote-save-status.warning {
      color: #845400;
      font-weight: 700;
    }

    .quote-save-status.error {
      color: #a00000;
      font-weight: 700;
    }

    .quote-setting-collapse {
      grid-column: 1 / -1;
      margin: 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .quote-setting-collapse summary {
      position: relative;
      min-height: 32px;
      display: flex;
      align-items: center;
      padding: 5px 12px 5px 34px;
      background: linear-gradient(90deg, var(--red-soft), #f7f9fc);
      color: var(--red-dark);
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }

    .quote-setting-collapse summary::-webkit-details-marker {
      display: none;
    }

    .quote-setting-collapse summary::before {
      content: "▸";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--navy-dark);
      font-size: 0.9rem;
      line-height: 1;
    }

    .quote-setting-collapse[open] summary::before {
      content: "▾";
    }

    .quote-setting-collapse summary:focus-visible {
      outline: 2px solid var(--navy-dark);
      outline-offset: -2px;
    }

    .quote-setting-collapse-body {
      padding: 5px 10px;
      background: var(--blue-input);
      border-top: 1px solid var(--line);
    }

    .quote-setting-collapse-body textarea {
      display: block;
      min-height: 64px;
    }

    .internal-notes-panel {
      padding: 14px 16px 16px;
      border-top: 3px solid var(--navy-dark);
      background: #f7f9fc;
    }

    .internal-notes-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .internal-notes-heading h3 {
      margin: 0;
      color: var(--navy-dark);
      font-size: 0.9rem;
    }

    .internal-notes-heading span {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
    }

    .internal-notes-panel textarea {
      display: block;
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid #aeb9c6;
      border-radius: 4px;
      padding: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      line-height: 1.4;
    }

    .internal-notes-panel textarea:focus {
      border-color: var(--navy-dark);
      outline: 2px solid rgba(0, 43, 91, 0.15);
      outline-offset: 1px;
    }

    .proposal {
      padding: 22px 24px 26px;
      background: #fff;
      min-height: 980px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
    }

    .proposal-head {
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 3px solid var(--red);
      padding-bottom: 10px;
      margin-bottom: 18px;
    }

    .proposal-logo {
      width: 150px;
      height: auto;
      flex: 0 0 auto;
    }

    .proposal-head h2 {
      margin: 0 0 6px;
      font-family: "Trebuchet MS", "Arial Narrow", Arial, Helvetica, sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: var(--navy-dark);
    }

    .company-line {
      color: #444;
      font-size: 0.82rem;
    }

    .proposal-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin: 16px 0 18px;
      font-size: 0.9rem;
    }

    .proposal-meta h3 {
      margin: 0 0 6px;
      color: var(--red-dark);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .proposal-meta p {
      margin: 2px 0;
      line-height: 1.34;
    }

    .proposal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
    }

    .proposal-table th {
      border-top: 2px solid var(--red);
      border-bottom: 1px solid #808080;
      padding: 7px 5px;
      text-align: left;
      font-weight: 800;
      color: #333;
    }

    .proposal-table td {
      border-bottom: 1px solid #e3e3e3;
      padding: 6px 5px;
      vertical-align: top;
      line-height: 1.25;
    }

    .proposal-table .qty,
    .proposal-table .money,
    .proposal-table .unit {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .section-row td {
      border-bottom: 0;
      padding: 12px 5px 5px;
      color: var(--red-dark);
      font-weight: 800;
      text-transform: uppercase;
    }

    .subtotal-row td {
      border-bottom: 1px solid #bcbcbc;
      font-weight: 800;
      padding-top: 5px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-top: 2px solid var(--red);
      margin-top: 12px;
      padding-top: 10px;
      font-weight: 800;
      font-size: 1rem;
    }

    .visit-cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0 18px;
    }

    .visit-card {
      border: 1px solid #c9d3dc;
      background: #f8fafc;
      padding: 9px;
      min-width: 0;
    }

    .visit-card span {
      display: block;
      color: var(--muted);
      font-size: 0.62rem;
      text-transform: uppercase;
      font-weight: 800;
    }

    .visit-card strong {
      display: block;
      margin-top: 4px;
      color: var(--navy-dark);
      font-size: 0.9rem;
      overflow-wrap: anywhere;
    }

    .notes h3 {
      margin: 18px 0 8px;
      font-size: 0.96rem;
    }

    .notes ul {
      margin: 0;
      padding-left: 18px;
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .proposal-intro,
    .proposal-terms {
      white-space: pre-line;
      font-size: 0.9rem;
      line-height: 1.4;
      margin: 12px 0;
    }

    .year-breakdown {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 0.78rem;
    }

    .year-breakdown th,
    .year-breakdown td {
      border-bottom: 1px solid #e3e3e3;
      padding: 7px 5px;
      vertical-align: top;
    }

    .year-breakdown th {
      text-align: left;
      border-top: 1px solid #808080;
      border-bottom: 1px solid #808080;
      font-weight: 800;
    }

    .year-breakdown .money {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .signature-lines {
      display: grid;
      grid-template-columns: 1fr 190px;
      column-gap: 24px;
      row-gap: 40px;
      margin-top: 34px;
      font-size: 0.82rem;
    }

    .signature-line {
      border-top: 1px solid #333;
      padding-top: 7px;
    }

    .empty {
      color: #777;
      font-style: italic;
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .app {
        width: calc(100% - 16px);
        padding-top: 10px;
      }

      .toolbar,
      .proposal-meta {
        grid-template-columns: 1fr;
        display: grid;
      }

      .actions {
        justify-content: stretch;
      }

      .button {
        flex: 1 1 auto;
      }

      .proposal {
        padding: 18px 12px;
      }

      .visit-cards {
        grid-template-columns: 1fr;
      }
    }



    /* ---- Collapsible estimator service sections ---- */
    .cell.section.estimator-section-header {
      padding: 0;
      cursor: pointer;
      user-select: none;
    }

    .estimator-section-toggle {
      width: 100%;
      min-height: 22px;
      border: 0;
      background: transparent;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 8px;
      font: inherit;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
    }

    .estimator-section-toggle:focus-visible {
      outline: 2px solid var(--navy-dark);
      outline-offset: -2px;
    }

    .estimator-section-caret {
      width: 1em;
      flex: 0 0 1em;
      text-align: center;
      font-size: 0.9em;
      line-height: 1;
    }

    padding: 12px 12px 14px;
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .job-summary-cell {
    position: relative;
    min-height: 82px;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: linear-gradient(180deg, #fbfdfe, #f4f8fb);
    box-shadow: var(--sh-1);
  }
  .job-summary-cell + .job-summary-cell { margin-left: 10px; }

  .job-summary-cell.highlight {
    border-color: #f0c8ac;
    background: linear-gradient(180deg, #fffdf8, #fff6e8);
    box-shadow: 0 1px 2px rgba(154,97,0,.1), 0 6px 16px rgba(154,97,0,.08);
  }

  .job-summary-label {
    color: var(--muted);
    font-size: .615rem;
    font-weight: 800;
    letter-spacing: .085em;
  }

  .job-summary-value {
    margin-top: 5px;
    color: var(--navy-deep);
    font-size: 1.34rem;
    font-weight: 750;
    line-height: 1.1;
    letter-spacing: -.022em;
    font-variant-numeric: tabular-nums;
  }
  .job-summary-value input {
    width: 132px;
    padding: 4px 8px;
    border: 1px solid #d6b48e;
    border-radius: var(--r-sm);
    background: #fff;
    color: var(--navy-deep);
    font-size: 1.2rem;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }
  .job-summary-value input:focus {
    border-color: var(--navy);
    outline: 3px solid rgba(13,79,124,.14);
    outline-offset: 0;
  }

  .job-summary-sub {
    margin-top: 6px;
    color: var(--muted);
    font-size: .685rem;
    line-height: 1.4;
  }
  .job-summary-sub.margin-good,
  .job-summary-sub.margin-warn,
  .job-summary-sub.margin-bad {
    /* The tile is a column flexbox, so `inline-block` blockifies and the pill
       would stretch edge to edge. `align-self` keeps it hugging its text. */
    align-self: stretch;
    margin-top: 7px;
    padding: 5px 9px;
    border-radius: 6px;
    font-size: .665rem;
    font-weight: 700;
    line-height: 1.35;
  }
  .job-summary-sub.margin-good { background: var(--good-bg); color: var(--good); }
  .job-summary-sub.margin-warn { background: var(--warn-bg); color: var(--warn); }
  .job-summary-sub.margin-bad  { background: var(--bad-bg);  color: var(--bad); }

  /* ---------------------------------------------------------------
     Job / quote input blocks
     --------------------------------------------------------------- */
  .top-inputs,
  .quote-settings {
    background: var(--paper);
    font-size: .74rem;
  }
  .top-inputs { grid-auto-rows: 34px; }
  .top-inputs .cell { min-height: 34px; }

  .top-inputs .cell.label,
  .quote-settings .cell.label {
    color: var(--ink-2);
    font-size: .715rem;
    font-weight: 650;
    letter-spacing: .002em;
  }

  .cell.input-cell {
    background: var(--blue-input);
    color: var(--blue-text);
    font-weight: 650;
  }
  .top-inputs .cell.input-cell:focus-within,
  .quote-settings .cell.input-cell:focus-within {
    background: #e2f1fc;
    box-shadow: inset 0 0 0 2px rgba(13,79,124,.42);
  }

  .top-inputs .state-badge { color: var(--navy); font-weight: 700; }

  .quote-storage-tools {
    gap: 6px;
    padding: 9px 12px;
    background: var(--soft);
    border-top: 1px solid var(--line);
  }
  .quote-storage-tools .button { min-height: 30px; font-size: .73rem; padding: 0 10px; }

  .quote-save-status {
    padding-left: 2px;
    font-size: .74rem;
    line-height: 1.45;
  }
  .quote-save-status.success { color: var(--good); }
  .quote-save-status.warning { color: var(--warn); }
  .quote-save-status.error   { color: var(--bad); }

  .quote-setting-collapse summary {
    min-height: 34px;
    padding: 6px 14px 6px 34px;
    background: var(--soft);
    color: var(--navy-dark);
    font-size: .755rem;
    font-weight: 700;
    letter-spacing: .045em;
    text-transform: uppercase;
  }
  .quote-setting-collapse summary:hover { background: var(--soft-2); }
  .quote-setting-collapse summary::before { color: var(--red); }
  .quote-setting-collapse-body {
    padding: 10px 12px 12px;
    background: #fbfdfe;
  }
  .quote-setting-collapse-body textarea {
    padding: 9px 11px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: #fff;
    color: var(--ink-2);
    font-size: .78rem;
    line-height: 1.5;
  }
  .quote-setting-collapse-body textarea:focus {
    border-color: var(--navy);
    outline: 3px solid rgba(13,79,124,.13);
  }

  /* ---------------------------------------------------------------
     Estimator grid
     Column widths are tuned so the grid's intrinsic minimum (≈624px)
     always fits inside the left layout track (min 648px). That keeps
     content from being silently clipped without turning the grid into
     a scroll container, which would break the sticky header.
     --------------------------------------------------------------- */
  .estimate-grid {
    grid-template-columns: 18px 30px minmax(210px, 1.9fr) 56px 58px 58px 68px 74px 82px;
    overflow-x: clip;
    font-size: .705rem;
  }

  .cell {
    min-height: 26px;
    padding: 2px 5px;
    border-right: 1px solid #eaf0f5;
    border-bottom: 1px solid #eaf0f5;
  }

  .cell.header {
    position: sticky;
    top: var(--stick);
    z-index: 30;
    padding: 5px 4px;
    background: linear-gradient(180deg, #14567f, var(--navy-dark));
    border-right-color: rgba(255,255,255,.14);
    border-bottom: 2px solid var(--red);
    color: #fff;
    font-size: .625rem;
    font-weight: 700;
    letter-spacing: .045em;
    text-transform: uppercase;
    line-height: 1.15;
    box-shadow: 0 6px 12px -8px rgba(10,52,85,.6);
  }

  .cell.label {
    color: var(--ink-2);
    font-weight: 600;
  }

  .cell.formula {
    background: var(--formula);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .cell.formula-strong {
    background: var(--formula-blue);
    color: var(--navy-deep);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .cell.section {
    min-height: 26px;
    border-left: 0;
    background: transparent;
  }
  .cell.section.estimator-section-header {
    background: linear-gradient(90deg, #e9f1f7, #f4f8fb 65%, #fff);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line-strong);
  }
  .estimator-section-toggle {
    min-height: 30px;
    padding: 4px 10px;
    color: var(--navy-deep);
    font-size: .655rem;
    font-weight: 750;
    letter-spacing: .05em;
    text-transform: uppercase;
    border-radius: 0;
  }
  .estimator-section-toggle:hover { background: rgba(13,79,124,.055); }
  .estimator-section-caret { color: var(--red); font-size: .8em; }
  .estimator-section-title { line-height: 1.25; }

  .cell input,
  .cell select {
    min-height: 18px;
    font-variant-numeric: tabular-nums;
  }
  .cell.input-cell input:focus,
  .cell.input-cell select:focus {
    outline: none;
  }

  .qty-mode-wrap {
    display: grid;
    gap: 2px;
    width: 100%;
  }
  .qty-mode-wrap input,
  .qty-mode-wrap select {
    width: 100%;
    min-width: 0;
  }
  .qty-mode-wrap select {
    padding: 0 2px;
    font-size: .62rem;
  }
  .qty-mode-wrap.is-each input {
    display: none;
  }

  .estimate-grid .cell.input-cell:focus-within {
    background: #ddeefb;
    box-shadow: inset 0 0 0 2px rgba(13,79,124,.45);
  }

  input[type="checkbox"] { accent-color: var(--navy); }

  input,
  select,
  textarea { border-radius: var(--r-sm) !important; }

  .sens-year-toggle {
    padding: 1px 6px;
    border: 1px solid #cfe0ee;
    border-radius: 999px;
    background: #eff7fc;
    color: var(--navy-dark);
    font-size: .92em;
  }
  .sens-year-toggle:hover { background: #e2eff9; }

  /* Estimator summary block */
  .cell.summary {
    background: #f6f9fc;
    color: var(--ink-2);
    font-size: .705rem;
    font-weight: 650;
  }
  .cell.summary.summary-label { background: var(--navy-deep); color: #fff; }
  .cell.summary.summary-value { background: var(--navy-deep); }
  .cell.summary.summary-label-left,
  .cell.summary.summary-label-right {
    color: var(--muted);
    font-weight: 600;
  }
  .cell.summary.summary-value-left,
  .cell.summary.summary-value-right {
    color: var(--navy-deep);
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }

  .cell.visit-head {
    background: linear-gradient(180deg, #14567f, var(--navy-dark));
    font-size: .585rem;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .cell.visit-row { background: #fff; }
  .cell.visit-name { border-left: 3px solid var(--red); font-weight: 700; color: var(--navy-deep); }
  .cell.visit-cost,
  .cell.visit-hours { font-variant-numeric: tabular-nums; }
  .cell.visit-date {
    white-space: normal;
    line-height: 1.2;
    font-size: .655rem;
  }
  .cell.visit-detail {
    background: #fbfcfe;
    border-left: 3px solid #e3ebf2;
    color: var(--muted);
    font-size: .655rem;
    line-height: 1.42;
  }

  /* ---------------------------------------------------------------
     Internal notes
     --------------------------------------------------------------- */
  .internal-notes-panel {
    padding: 15px 16px 18px;
    border-top: 1px solid var(--line);
    background: var(--soft);
  }
  .internal-notes-heading h3 {
    font-size: .78rem;
    font-weight: 750;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .internal-notes-heading span { font-size: .69rem; }
  .internal-notes-panel textarea {
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    font-size: .8rem;
  }

  /* ---------------------------------------------------------------
     Customer-facing proposal preview (paper)
     --------------------------------------------------------------- */
  .proposal {
    padding: 26px 28px 30px;
    background: #fff;
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    font-size: .79rem;
    color: var(--ink);
  }

  .proposal-head { gap: 16px; border-bottom-width: 2px; padding-bottom: 12px; }
  .proposal-head h2 {
    font-family: inherit;
    font-size: 1.32rem;
    font-weight: 750;
    letter-spacing: -.018em;
    color: var(--navy-deep);
  }
  .company-line { color: var(--muted); font-size: .77rem; }

  .proposal-meta {
    gap: 14px;
    padding: 13px 15px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--soft);
    font-size: .8rem;
  }
  .proposal-meta h3 {
    margin-bottom: 7px;
    color: var(--red-dark);
    font-size: .625rem;
    font-weight: 800;
    letter-spacing: .1em;
  }
  .proposal-meta p { line-height: 1.42; }

  .proposal-intro,
  .proposal-terms {
    color: var(--ink-2);
    font-size: .8rem;
    line-height: 1.55;
  }
  .proposal-terms {
    padding: 12px 14px;
    border-left: 3px solid var(--line-strong);
    background: #fbfcfd;
    color: var(--muted);
    font-size: .74rem;
  }

  .proposal-table { font-size: .745rem; }
  .proposal-table th {
    padding: 8px 7px;
    border-top: 2px solid var(--navy-deep);
    border-bottom: 1px solid var(--line-strong);
    color: var(--navy-deep);
    font-size: .625rem;
    font-weight: 800;
    letter-spacing: .075em;
    text-transform: uppercase;
  }
  .proposal-table td {
    padding: 7px 7px;
    border-bottom: 1px solid #eef2f6;
    line-height: 1.38;
  }
  .proposal-table tbody tr:hover td { background: #fafcfe; }
  .proposal-table .money,
  .proposal-table .unit,
  .proposal-table .qty { font-variant-numeric: tabular-nums; }
  .proposal-table .money { font-weight: 650; color: var(--navy-deep); }

  .section-row td {
    padding: 14px 7px 6px;
    border-bottom: 1px solid var(--line-strong);
    color: var(--red-dark);
    font-size: .655rem;
    font-weight: 800;
    letter-spacing: .085em;
  }

  .summary-total {
    align-items: baseline;
    margin-top: 6px;
    padding: 7px 12px;
    border: 0;
    border-radius: var(--r-sm);
    background: var(--soft);
    color: var(--ink-2);
    font-size: .82rem;
    font-weight: 650;
    letter-spacing: .05em;
  }
  .summary-total span:last-child {
    color: var(--navy-deep);
    font-size: .95rem;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }
  #proposalGrandTotalRow {
    margin-top: 9px;
    padding: 11px 13px;
    background: linear-gradient(100deg, var(--navy-deep), var(--navy));
    color: #fff;
    font-size: .88rem;
    font-weight: 750;
  }
  #proposalGrandTotalRow span:last-child { color: #fff; font-size: 1.16rem; }
  #quarterlyBillingSummary {
    background: var(--red-soft);
    color: var(--red-dark);
  }
  #quarterlyBillingSummary span:last-child { color: var(--red-dark); }

  .year-breakdown { font-size: .755rem; }
  .year-breakdown th {
    border-top: 1px solid var(--navy-deep);
    border-bottom: 1px solid var(--line-strong);
    color: var(--navy-deep);
    font-size: .625rem;
    letter-spacing: .075em;
    text-transform: uppercase;
  }
  .year-breakdown .money { font-variant-numeric: tabular-nums; }

  .visit-cards { gap: 9px; }
  .visit-card {
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--soft);
    padding: 10px 11px;
  }
  .visit-card span { font-size: .58rem; letter-spacing: .075em; color: var(--muted); }
  .visit-card strong {
    margin-top: 5px;
    color: var(--navy-deep);
    font-size: .95rem;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
  }

  .notes h3 {
    margin: 20px 0 8px;
    color: var(--navy-deep);
    font-size: .72rem;
    font-weight: 800;
    letter-spacing: .085em;
    text-transform: uppercase;
  }
  .notes ul { font-size: .78rem; line-height: 1.5; color: var(--ink-2); }
  .notes li { margin-bottom: 4px; }

  .signature-lines { font-size: .78rem; color: var(--muted); }
  .signature-line { border-top: 1px solid var(--ink-2); }

  /* ---------------------------------------------------------------
     Internal service tool
     --------------------------------------------------------------- */
  .internal-tool-shell { gap: 16px; }
  .internal-panel,
  .internal-preview-card {
    overflow: clip;
    border: 1px solid #cfdbe5;
    border-top: 0;
    border-radius: var(--r-lg);
    box-shadow: var(--sh-3);
  }
  .internal-panel-title {
    padding: 11px 16px;
    background: linear-gradient(100deg, var(--navy-deep) 0%, var(--navy) 68%, #1d6a9e 100%);
    font-size: .84rem;
    letter-spacing: .085em;
    text-transform: uppercase;
  }
  .internal-subhead {
    padding: 9px 14px;
    background: var(--soft);
    border-color: var(--line);
    color: var(--navy-deep);
    font-size: .73rem;
    font-weight: 750;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .internal-subhead small { font-size: .68rem; letter-spacing: 0; text-transform: none; }
  .internal-form-grid { background: var(--line); }
  .internal-form-grid label { color: var(--ink-2); font-size: .73rem; font-weight: 650; }
  .internal-form-grid .field:focus-within {
    background: #e2f1fc;
    box-shadow: inset 0 0 0 2px rgba(13,79,124,.4);
  }
  .internal-table th {
    background: linear-gradient(180deg, #14567f, var(--navy-dark));
    font-size: .625rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    border-bottom: 2px solid var(--red);
  }
  .internal-table td { border-bottom-color: #eef2f6; }
  .internal-table tbody tr:hover td { background: #fafcfe; }
  .internal-row-selected td { background: #eef7fd !important; }
  .internal-table td.num { font-variant-numeric: tabular-nums; }
  .internal-actions { padding: 13px; background: var(--soft); }
  .internal-preview-card { position: sticky; top: calc(var(--bar-h) + 22px); }
  .internal-kpi {
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--soft);
    padding: 9px 10px;
  }
  .internal-kpi strong { font-variant-numeric: tabular-nums; }
  .internal-total-row.grand {
    margin-top: 8px;
    padding: 10px 12px;
    border: 0;
    border-radius: var(--r-sm);
    background: linear-gradient(100deg, var(--navy-deep), var(--navy));
    color: #fff;
  }
  .internal-agreement-page-chip {
    border-color: #cfe0ee;
    border-radius: 999px;
    background: #eff7fc;
    color: var(--navy-dark);
  }

  /* Scrollbars */
  * { scrollbar-color: #b9c8d5 transparent; scrollbar-width: thin; }
  *::-webkit-scrollbar { width: 11px; height: 11px; }
  *::-webkit-scrollbar-thumb {
    border: 3px solid transparent;
    border-radius: 8px;
    background: #b9c8d5;
    background-clip: padding-box;
  }
  *::-webkit-scrollbar-thumb:hover { background: #93a8b9; background-clip: padding-box; }
  *::-webkit-scrollbar-track { background: transparent; }

  /* ---------------------------------------------------------------
     Responsive
     --------------------------------------------------------------- */
  @media (max-width: 1400px) {
    .prototype-title p { display: none; }
  }

  @media (max-width: 1260px) {
    .layout { grid-template-columns: 1fr; }
    .prototype-title { display: none; }
    .brand-logo { width: 132px; }
  }

  @media (max-width: 900px) {
    :root { --bar-h: 0px; --stick: 0px; }
    .toolbar {
      position: relative;
      top: 0;
      flex-direction: column;
      align-items: stretch;
      backdrop-filter: none;
      background: #fff;
    }
    .actions { justify-content: flex-start; }
    .job-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .job-summary-cell + .job-summary-cell { margin-left: 0; }
  }

  @media (max-width: 620px) {
    .job-summary { grid-template-columns: 1fr; }
    .action-group { flex-wrap: wrap; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
}

/* =====================================================================
   Print — customer-facing output
   ===================================================================== */
@media print {
  :root {
    --navy: #0d4f7c;
    --navy-dark: #0a3455;
    --navy-deep: #072438;
    --red: #d81f2a;
    --red-dark: #a3151f;
    --red-soft: #fdeced;
    --ink: #17222c;
    --ink-2: #35485a;
    --muted: #6b7d8c;
    --faint: #93a3b0;
    --line: #dbe4ec;
    --line-strong: #c2d0dc;
    --paper: #ffffff;
    --soft: #f4f8fb;
    --soft-2: #eaf1f7;
    --r-sm: 5px;
    --r-md: 9px;
    --r-lg: 14px;
    --bar-h: 0px;
    --stick: 0px;
  }

  /* The itemized print now uses the same visual system as the live proposal
     preview on the home screen. */
  .proposal {
    padding: 26px 28px 30px;
    background: #fff;
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    font-size: .79rem;
    color: var(--ink);
  }

  .proposal-head { gap: 16px; border-bottom-width: 2px; padding-bottom: 12px; }
  .proposal-head h2 {
    font-family: inherit;
    font-size: 1.32rem;
    font-weight: 750;
    letter-spacing: -.018em;
    color: var(--navy-deep);
  }
  .company-line { color: var(--muted); font-size: .77rem; }

  .proposal-meta {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: start;
    gap: 14px;
    padding: 13px 15px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--soft) !important;
    font-size: .8rem;
  }
  .proposal-meta h3 {
    margin-bottom: 7px;
    color: var(--red-dark);
    font-size: .625rem;
    font-weight: 800;
    letter-spacing: .1em;
  }
  .proposal-meta p { line-height: 1.42; }

  .proposal-intro,
  .proposal-terms {
    color: var(--ink-2);
    font-size: .8rem;
    line-height: 1.55;
  }
  .proposal-terms {
    padding: 12px 14px;
    border-left: 3px solid var(--line-strong);
    background: #fbfcfd !important;
    color: var(--muted);
    font-size: .74rem;
  }

  .proposal-table { font-size: .745rem; }
  .proposal-table th {
    padding: 8px 7px;
    border-top: 2px solid var(--navy-deep);
    border-bottom: 1px solid var(--line-strong);
    color: var(--navy-deep);
    font-size: .625rem;
    font-weight: 800;
    letter-spacing: .075em;
    text-transform: uppercase;
  }
  .proposal-table td {
    padding: 7px;
    border-bottom: 1px solid #eef2f6;
    line-height: 1.38;
  }
  .proposal-table .money,
  .proposal-table .unit,
  .proposal-table .qty { font-variant-numeric: tabular-nums; }
  .proposal-table .money { font-weight: 650; color: var(--navy-deep); }

  .section-row td {
    padding: 14px 7px 6px;
    border-bottom: 1px solid var(--line-strong);
    color: var(--red-dark);
    font-size: .655rem;
    font-weight: 800;
    letter-spacing: .085em;
  }

  .summary-total {
    align-items: baseline;
    margin-top: 6px;
